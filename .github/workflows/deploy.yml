name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

# Only one deploy at a time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Run tests first — don't deploy broken code
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Test Frontend
        working-directory: ./frontend
        run: npm ci && npm run lint && npm test

      - name: Install & Test Backend
        working-directory: ./backend
        run: npm ci && npx prisma generate && npm test

  # Deploy frontend to S3 + invalidate CloudFront cache
  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Sync hashed assets to S3 (long cache)
        run: |
          aws s3 sync frontend/dist/ s3://ai-slug-navigator-frontend \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML to S3 (no cache)
        run: |
          aws s3 sync frontend/dist/ s3://ai-slug-navigator-frontend \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  # Deploy backend to EC2 via SSH
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            cd /home/ec2-user/ai-slug-navigator || git clone ${{ secrets.REPO_URL }} /home/ec2-user/ai-slug-navigator
            cd /home/ec2-user/ai-slug-navigator
            git pull origin main

            cd backend
            docker build -t ai-slug-navigator-backend .
            docker stop ai-slug-backend 2>/dev/null || true
            docker rm ai-slug-backend 2>/dev/null || true
            docker run -d \
              --name ai-slug-backend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e DIRECT_URL="${{ secrets.DIRECT_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e NODE_ENV=production \
              -e PORT=3000 \
              ai-slug-navigator-backend

  # Deploy Lambda scraper
  deploy-lambda:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Lambda Package
        working-directory: ./lambda/scraper
        run: |
          npm install
          npx prisma generate
          npx tsc
          # Strip dev deps (typescript, prisma CLI, @types) from the runtime bundle
          npm prune --omit=dev
          zip -r ../../scraper-lambda.zip handler.js package.json node_modules prisma -x 'node_modules/.cache/*' '*.ts' 'tsconfig.json'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Update Lambda Function
        run: aws lambda update-function-code --function-name ai-slug-navigator-scraper --zip-file fileb://scraper-lambda.zip
