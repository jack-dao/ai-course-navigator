name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

# Only one deploy at a time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Run tests first — don't deploy broken code
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Test Frontend
        working-directory: ./frontend
        run: npm ci && npm run lint && npm test

      - name: Install & Test Backend
        working-directory: ./backend
        run: npm ci && npx prisma generate && npm test

  # Deploy frontend to S3 + invalidate CloudFront cache
  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Sync hashed assets to S3 (long cache)
        run: |
          aws s3 sync frontend/dist/ s3://ai-slug-navigator-frontend \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML to S3 (no cache)
        run: |
          aws s3 sync frontend/dist/ s3://ai-slug-navigator-frontend \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  # Deploy backend to EC2 via SSM Run Command (no SSH).
  # The script fetches secrets from AWS Secrets Manager via the instance role,
  # so secrets never traverse GitHub Actions or SSM command logs.
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Resolve EC2 instance ID
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ai-slug-navigator-backend" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not resolve backend instance ID" >&2
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        run: |
          # git pull is in the SSM command (not just the script) so the very
          # first deploy after merge can fetch the script itself.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["export HOME=/root && cd /home/ec2-user/ai-slug-navigator && git config --global --add safe.directory /home/ec2-user/ai-slug-navigator 2>/dev/null || true && git pull origin main && bash scripts/deploy-on-ec2.sh > /tmp/deploy.log 2>&1 && echo DEPLOY_OK || { tail -30 /tmp/deploy.log; exit 1; }"]' \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --query "Command.CommandId" \
            --output text)
          echo "Started SSM command $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "Status" --output text)

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command finished with status $STATUS" >&2
            exit 1
          fi

      - name: Verify backend health
        run: |
          BACKEND_URL="${{ secrets.BACKEND_HEALTH_URL }}"
          if [ -n "$BACKEND_URL" ]; then
            for i in $(seq 1 5); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Backend is healthy (HTTP 200)."
                exit 0
              fi
              echo "Attempt $i: got HTTP $STATUS, retrying..."
              sleep 5
            done
            echo "Backend health check failed after 5 attempts." >&2
            exit 1
          else
            echo "BACKEND_HEALTH_URL not set, skipping external health check."
          fi

  # Deploy Lambda scraper
  deploy-lambda:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Lambda Package
        working-directory: ./lambda/scraper
        run: |
          npm install
          npx prisma generate
          npx tsc
          # Strip dev deps (typescript, prisma CLI, @types) from the runtime bundle
          npm prune --omit=dev
          zip -r ../../scraper-lambda.zip handler.js package.json node_modules prisma -x 'node_modules/.cache/*' '*.ts' 'tsconfig.json'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Update Lambda Function
        run: |
          aws s3 cp scraper-lambda.zip s3://ai-slug-navigator-terraform-state/lambda/scraper-lambda.zip
          aws lambda update-function-code \
            --function-name ai-slug-navigator-scraper \
            --s3-bucket ai-slug-navigator-terraform-state \
            --s3-key lambda/scraper-lambda.zip

          # Wait for update to complete before publishing
          aws lambda wait function-updated --function-name ai-slug-navigator-scraper

          # Publish new version and update alias for rollback support
          VERSION=$(aws lambda publish-version \
            --function-name ai-slug-navigator-scraper \
            --query 'Version' --output text)
          echo "Published Lambda version: $VERSION"

          aws lambda update-alias \
            --function-name ai-slug-navigator-scraper \
            --name live \
            --function-version "$VERSION"
          echo "Updated 'live' alias to version $VERSION"
